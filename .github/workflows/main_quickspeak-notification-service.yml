name: Deploy QuickSpeak Notification Service

on:
  push:
    branches: [ main ]
    paths:
      - 'notification-service/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: quickspeak-notification-service
  AZURE_RESOURCE_GROUP: QuickSpeakResourceGroup

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        slot-name: 'Production'
        package: .
      env:
        AZURE_SERVICE_BUS_CONNECTION_STRING: ${{ secrets.AZURE_SERVICE_BUS_CONNECTION_STRING }}
        AZURE_SERVICE_BUS_QUEUE_NAME: notifications-queue
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        SKIP_MTLS: false
        NODE_ENV: production